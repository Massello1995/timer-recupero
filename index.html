<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Timer recupero</title>
<!-- Pagina del timer di recupero aperta dal bot Telegram (Mini App). Non contiene dati. Riceve dal tasto la durata (sec),
     un codice a caso (k) e l'indirizzo del "postino" (t, su ntfy.sh). Avvisa il gestionale con due soli biglietti:
     «avvio» (aperta da Avvia recupero) e «suonato» (a fine recupero ha suonato). Nessuna richiesta verso il gestionale. -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --canvas: #1d2024; --scheda: #262a2f; --bordo: #3a3f46; --testo: #e3e5e9; --muto: #a6adb7;
    --rosso: #e0263d; --rosso-scuro: #43202a; --ok: #4fc58d; --anello-vuoto: #343940;
    --font: "Barlow", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow-x: hidden; }
  body {
    background: var(--canvas); color: var(--testo); font-family: var(--font);
    display: flex; flex-direction: column; align-items: center; justify-content: space-between;
    min-height: 100dvh; padding: max(16px, env(safe-area-inset-top)) 16px max(20px, env(safe-area-inset-bottom));
    -webkit-tap-highlight-color: transparent; user-select: none; touch-action: manipulation;
    transition: background-color .25s ease;
  }
  body.fine { background: var(--rosso-scuro); }
  body.fine.lampo { background: var(--rosso); }
  @media (prefers-reduced-motion: reduce) { body, body.fine.lampo { transition: none; } body.fine.lampo { background: var(--rosso-scuro); } }
  header { text-align: center; width: 100%; }
  .titolo { font-size: 18px; font-weight: 600; letter-spacing: .02em; color: var(--muto); margin: 4px 0 0; }
  .stato { display: inline-flex; align-items: center; gap: 8px; margin-top: 10px; padding: 7px 13px; border-radius: 999px;
           font-size: 14px; font-weight: 600; background: var(--scheda); border: 1px solid var(--bordo); color: var(--muto); }
  .stato.on { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 45%, transparent); }
  .stato svg { width: 17px; height: 17px; flex: none; }
  main { position: relative; width: min(88vw, 62dvh, 420px); aspect-ratio: 1; display: grid; place-items: center; }
  main svg.anello { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); }
  .anello circle { fill: none; stroke-width: 7; }
  .anello .vuoto { stroke: var(--anello-vuoto); }
  .anello .pieno { stroke: var(--rosso); stroke-linecap: round; transition: stroke-dashoffset 1s linear; }
  @media (prefers-reduced-motion: reduce) { .anello .pieno { transition: none; } }
  .tempo { font-variant-numeric: tabular-nums; font-weight: 700; font-size: min(24vw, 15dvh, 120px); line-height: 1; letter-spacing: -.02em; }
  .sotto { position: absolute; bottom: 22%; font-size: 17px; color: var(--muto); font-weight: 500; text-align: center; padding: 0 12%; }
  body.fine .tempo { font-size: min(11vw, 8dvh, 56px); text-align: center; max-width: 78%; line-height: 1.1; overflow-wrap: anywhere; }
  footer { width: 100%; max-width: 420px; display: grid; gap: 10px; }
  button { font: inherit; font-size: 18px; font-weight: 700; min-height: 56px; border-radius: 14px; border: 0; cursor: pointer; width: 100%;
           background: #fff; color: #1d2024; }
  button[hidden] { display: none; }
  button:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
  button:active { filter: brightness(.92); }
  .nota { font-size: 14px; color: var(--muto); text-align: center; line-height: 1.45; margin: 2px 4px 0; }
  body.fine .nota, body.fine .titolo { color: #f3d6da; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
</style>
</head>
<body>
<header>
  <p class="titolo">Recupero</p>
  <span class="stato" id="stato" role="status">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
    <span id="statoTesto">Sveglia…</span>
  </span>
</header>

<main>
  <svg class="anello" viewBox="0 0 100 100" aria-hidden="true">
    <circle class="vuoto" cx="50" cy="50" r="45"/>
    <circle class="pieno" id="pieno" cx="50" cy="50" r="45" stroke-dasharray="282.74" stroke-dashoffset="0"/>
  </svg>
  <div class="tempo" id="tempo" role="timer" aria-live="off">--:--</div>
  <div class="sotto" id="sotto"></div>
</main>

<footer>
  <button id="fermo" type="button" hidden>Fermo</button>
  <p class="nota" id="nota">Per chiudere usa la X in alto. Se chiudi prima della fine, ti avvisa il bot.</p>
</footer>
<div class="sr" aria-live="assertive" id="annuncio"></div>

<script>
(() => {
  const tg = window.Telegram && window.Telegram.WebApp;
  const $ = id => document.getElementById(id);
  const q = new URLSearchParams(location.search);
  const sec = Math.max(1, Math.min(3600, parseInt(q.get('sec'), 10) || 0));
  const k = q.get('k') || '', topic = q.get('t') || '';
  const server = (q.get('s') || 'https://ntfy.sh').replace(/\/+$/, '');
  const GIRO = 282.74;
  let audio = null, wake = null, suonato = false, fermato = false, lampo = null;
  let programmati = [], oraSveglia = 0;

  try {
    if (tg) {
      tg.ready(); tg.expand();
      if (tg.disableVerticalSwipes) tg.disableVerticalSwipes();  // una strisciata non chiude la pagina per sbaglio
      if (tg.setHeaderColor) tg.setHeaderColor('#1d2024');
      if (tg.setBackgroundColor) tg.setBackgroundColor('#1d2024');
    }
  } catch (e) {}

  const adesso = Date.now();
  let fine;
  if (q.get('avvio')) fine = adesso + sec * 1000;          // aperta da «Avvia recupero»: si parte adesso
  else fine = parseInt(q.get('fine'), 10) || 0;            // riaperta: l'ora di fine la dice il bot
  if (!q.get('sec') || !fine) {
    $('tempo').textContent = '--:--';
    $('sotto').textContent = 'Apri il timer dal tasto del bot';
    $('stato').hidden = true; $('nota').hidden = true;
    return;
  }
  if (fine - adesso > sec * 1000 + 2000) fine = adesso + sec * 1000;  // orologio del telefono diverso da quello del PC
  const giaFinito = fine - adesso < -5000;

  // ---- postino (ntfy.sh): un biglietto solo; se non passa, al massimo 3 tentativi ----
  async function biglietto(e) {
    if (!k || !topic) return false;
    for (let i = 0; i < 3; i++) {
      try {
        const ctl = new AbortController(), stop = setTimeout(() => ctl.abort(), 3000);
        const r = await fetch(`${server}/${encodeURIComponent(topic)}`, { method: 'POST', body: JSON.stringify({ k, e }), keepalive: true, signal: ctl.signal });
        clearTimeout(stop);
        if (r.ok) return true;
      } catch (err) {}
      await new Promise(r => setTimeout(r, 400 * (i + 1)));
    }
    return false;
  }
  if (q.get('avvio') && !giaFinito) biglietto('avvio');

  const mmss = ms => { const s = Math.max(0, Math.ceil(ms / 1000)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; };
  const annuncia = t => { $('annuncio').textContent = ''; setTimeout(() => { $('annuncio').textContent = t; }, 50); };
  const suonaOk = () => !!(audio && audio.state === 'running');

  function vibra(forte) {
    try { if (tg && tg.HapticFeedback) { forte ? tg.HapticFeedback.notificationOccurred('warning') : tg.HapticFeedback.impactOccurred('light'); } } catch (e) {}
    try { if (navigator.vibrate) navigator.vibrate(forte ? [400, 150, 400, 150, 400] : 60); } catch (e) {}
  }

  function bip(freq, dur, vol, quando) {
    if (!audio) return null;
    const t0 = audio.currentTime + (quando || 0);
    const o = audio.createOscillator(), g = audio.createGain();
    o.type = 'square'; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.01);
    g.gain.setValueAtTime(vol, t0 + dur - 0.03);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g).connect(audio.destination);
    o.start(t0); o.stop(t0 + dur + 0.02);
    return o;
  }

  function sveglia(tra) {  // circa 5 secondi di "bip-bip-bip" forte (2/3 di prima), tra "tra" secondi
    const l = [];
    for (let i = 0; i < 5; i++) l.push(bip(1046, 0.16, 0.9, (tra || 0) + i), bip(1318, 0.16, 0.9, (tra || 0) + i + 0.22), bip(1046, 0.16, 0.9, (tra || 0) + i + 0.44));
    l.push(bip(1046, 0.16, 0.9, (tra || 0) + 5));  // ultimo bip: in tutto circa 5,3 secondi
    return l.filter(Boolean);
  }

  // La sveglia si programma nel motore audio all'ora di fine: se abbassi la pagina dentro Telegram e il telefono la tiene viva, suona lo stesso.
  function programma() {
    if (!suonaOk() || programmati.length || suonato) return;
    const tra = (fine - Date.now()) / 1000;
    if (tra <= 0.3) return;
    oraSveglia = audio.currentTime + tra;
    programmati = sveglia(tra);
  }
  function togliProgrammati() { programmati.forEach(o => { try { o.stop(); } catch (e) {} }); programmati = []; }

  function aggiornaStato() {
    const ok = suonaOk();
    $('stato').classList.toggle('on', ok);
    $('statoTesto').textContent = ok ? 'Sveglia pronta' : 'Tocca lo schermo per il suono';
  }

  // Il suono parte da solo se il telefono lo permette; se no basta un tocco qualsiasi sulla pagina (nessun riquadro da toccare).
  async function sblocca() {
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC && !audio) audio = new AC();
      if (audio && audio.state === 'suspended') await audio.resume();
    } catch (e) {}
    aggiornaStato();
    programma();
  }
  async function tieniAcceso() {
    try { if ('wakeLock' in navigator && !wake) { wake = await navigator.wakeLock.request('screen'); wake.addEventListener('release', () => { wake = null; }); } } catch (e) {}
  }
  ['pointerdown', 'touchstart', 'keydown'].forEach(ev => document.addEventListener(ev, () => { sblocca(); tieniAcceso(); }, { passive: true }));

  function fermaTutto() {
    fermato = true;
    togliProgrammati();
    if (lampo) { clearInterval(lampo); lampo = null; }
    document.body.classList.remove('lampo');
    try { if (audio) audio.suspend(); } catch (e) {}
    try { if (navigator.vibrate) navigator.vibrate(0); } catch (e) {}
    $('fermo').hidden = true;
    $('sotto').textContent = 'Sveglia fermata';
  }

  function finito() {
    document.body.classList.add('fine');
    $('tempo').textContent = 'Prossima serie!';
    $('sotto').textContent = '';
    $('pieno').style.strokeDashoffset = GIRO;
    if (suonato || giaFinito || Date.now() - fine >= 5000) return;  // tornato sulla pagina molto dopo: niente sveglia in ritardo
    suonato = true;
    annuncia('Recupero finito: prossima serie');
    const sento = suonaOk();
    if (sento) {
      if (!programmati.length) programmati = sveglia(0);  // se era già programmata sta suonando da sola
      biglietto('suonato');  // il bot non manda i suoi messaggi
    }
    $('fermo').hidden = false;
    let n = 0;
    lampo = setInterval(() => {
      if (fermato || n++ > 15) { clearInterval(lampo); lampo = null; document.body.classList.remove('lampo'); return; }
      document.body.classList.toggle('lampo');
      if (n % 2) vibra(true);
    }, 500);
  }

  function giro() {
    if (fermato) return;
    const resto = fine - Date.now();
    if (resto <= 0) { finito(); return; }
    $('tempo').textContent = mmss(resto);
    $('pieno').style.strokeDashoffset = GIRO * (1 - Math.min(1, resto / (sec * 1000)));
    $('sotto').textContent = resto <= 10000 ? 'Preparati' : `di ${mmss(sec * 1000)}`;
    setTimeout(giro, Math.min(250, resto));
  }

  $('fermo').onclick = fermaTutto;
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState !== 'visible') return;
    tieniAcceso();
    if (programmati.length && audio && audio.currentTime < oraSveglia && Date.now() > fine + 5000) togliProgrammati();
    if (audio && audio.state === 'suspended' && !fermato) audio.resume().then(aggiornaStato).catch(() => {});
  });

  sblocca(); tieniAcceso();
  setTimeout(aggiornaStato, 600);
  if (giaFinito) { finito(); $('sotto').textContent = 'Il recupero era già finito'; }
  else giro();
})();
</script>
</body>
</html>
