<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Timer recupero</title>
<!-- Pagina del timer di recupero aperta dal bot Telegram (Mini App). Non contiene dati. Riceve dal tasto la durata (sec),
     un codice a caso (k) e l'indirizzo del "postino" (t, su ntfy.sh). Biglietti al gestionale: «avvio» (aperta da Avvia
     recupero), «pronta» (sveglia programmata: il bot non manda messaggi), «suonato», «fine» (viva ma senza suono),
     «ferma» e «chiusa» (chiusa prima della sveglia: squilla il bot). Nessuna richiesta verso il gestionale. -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --canvas: #1d2024; --scheda: #262a2f; --bordo: #3a3f46; --testo: #e3e5e9; --muto: #a6adb7;
    --rosso: #e0263d; --rosso-scuro: #43202a; --ok: #4fc58d; --anello-vuoto: #343940;
    --font: "Barlow", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  /* La pagina è alta ESATTAMENTE quanto lo schermo e non scorre mai: così ogni strisciata verso il basso, in qualsiasi
     punto (anche sul cronometro), va a Telegram che abbassa la pagina, invece di far scorrere la pagina di qualche pixel. */
  /* Altezza = finestra vera (100%), non il valore di Telegram che si aggiorna in ritardo mentre la pagina si apre o si
     allarga (metà schermo restava scoperta e sembrava oscurata). Anche lo sfondo sotto è dello stesso colore. */
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--canvas); }
  body {
    background: var(--canvas); color: var(--testo); font-family: var(--font);
    display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: max(16px, env(safe-area-inset-top)) 16px max(20px, env(safe-area-inset-bottom));
    -webkit-tap-highlight-color: transparent; user-select: none; touch-action: manipulation;
    transition: background-color .25s ease;
  }
  body.fine { background: var(--rosso-scuro); }
  body.fine.lampo { background: var(--rosso); }
  @media (prefers-reduced-motion: reduce) { body, body.fine.lampo { transition: none; } body.fine.lampo { background: var(--rosso-scuro); } }
  header { text-align: center; width: 100%; }
  .titolo { font-size: 18px; font-weight: 600; letter-spacing: .02em; color: var(--muto); margin: 4px 0 0; }
  .stato { display: inline-flex; align-items: center; gap: 8px; margin-top: 10px; padding: 7px 13px; border-radius: 999px;
           font-size: 14px; font-weight: 600; background: var(--scheda); border: 1px solid var(--bordo); color: var(--muto); }
  .stato.on { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 45%, transparent); }
  .stato svg { width: 17px; height: 17px; flex: none; }
  main { position: relative; width: min(88vw, 62dvh, 420px); aspect-ratio: 1; display: grid; place-items: center; }
  main svg.anello { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); }
  .anello circle { fill: none; stroke-width: 7; }
  .anello .vuoto { stroke: var(--anello-vuoto); }
  .anello .pieno { stroke: var(--rosso); stroke-linecap: round; transition: stroke-dashoffset 1s linear; }
  @media (prefers-reduced-motion: reduce) { .anello .pieno { transition: none; } }
  .tempo { font-variant-numeric: tabular-nums; font-weight: 700; font-size: min(24vw, 15dvh, 120px); line-height: 1; letter-spacing: -.02em; }
  .sotto { position: absolute; bottom: 22%; font-size: 17px; color: var(--muto); font-weight: 500; text-align: center; padding: 0 12%; }
  body.fine .tempo { font-size: min(11vw, 8dvh, 56px); text-align: center; max-width: 78%; line-height: 1.1; overflow-wrap: anywhere; }
  footer { width: 100%; max-width: 420px; display: grid; gap: 10px; }
  button { font: inherit; font-size: 18px; font-weight: 700; min-height: 56px; border-radius: 14px; border: 0; cursor: pointer; width: 100%;
           background: #fff; color: #1d2024; }
  button[hidden] { display: none; }
  button:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
  button:active { filter: brightness(.92); }
  .nota { font-size: 14px; color: var(--muto); text-align: center; line-height: 1.45; margin: 2px 4px 0; }
  body.fine .nota, body.fine .titolo { color: #f3d6da; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  /* − 5 s / + 5 s (dal 24/11/2026): tasti secondari, grandi per le dita sudate, staccati da «Ferma» */
  .regola { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .regola[hidden] { display: none; }
  button.sec { background: var(--scheda); color: var(--testo); border: 1px solid var(--bordo); font-variant-numeric: tabular-nums; }
  button.sec:disabled { opacity: .4; cursor: default; }
</style>
</head>
<body>
<header>
  <p class="titolo">Recupero</p>
  <span class="stato" id="stato" role="status">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
    <span id="statoTesto">Sveglia…</span>
  </span>
</header>

<main>
  <svg class="anello" viewBox="0 0 100 100" aria-hidden="true">
    <circle class="vuoto" cx="50" cy="50" r="45"/>
    <circle class="pieno" id="pieno" cx="50" cy="50" r="45" stroke-dasharray="282.74" stroke-dashoffset="0"/>
  </svg>
  <div class="tempo" id="tempo" role="timer" aria-live="off">--:--</div>
  <div class="sotto" id="sotto"></div>
</main>

<footer>
  <div class="regola" id="regola">
    <button id="meno" class="sec" type="button" aria-label="Togli 5 secondi">− 5 s</button>
    <button id="piu" class="sec" type="button" aria-label="Aggiungi 5 secondi">+ 5 s</button>
  </div>
  <button id="fermo" type="button">Ferma</button>
  <p class="nota" id="nota">Abbassala strisciando verso il basso la barra in alto: suona lo stesso. «Ferma» ferma il recupero e la chiude.</p>
</footer>
<div class="sr" aria-live="assertive" id="annuncio"></div>

<script>
(() => {
  const tg = window.Telegram && window.Telegram.WebApp;
  const $ = id => document.getElementById(id);
  const q = new URLSearchParams(location.search);
  let sec = Math.max(1, Math.min(3600, parseInt(q.get('sec'), 10) || 0));  // cambia con − 5 s / + 5 s
  const k = q.get('k') || '', topic = q.get('t') || '';
  const server = (q.get('s') || 'https://ntfy.sh').replace(/\/+$/, '');
  const GIRO = 282.74;
  const VERSIONE = '25nov-3-squilli';  // finisce nel registro del gestionale: si vede quale pagina ha usato il telefono
  let audio = null, wake = null, suonato = false, fermato = false, lampo = null;
  let programmati = [], oraSveglia = 0;

  try {
    if (tg) {
      tg.ready(); tg.expand();
      if (tg.enableVerticalSwipes) tg.enableVerticalSwipes();  // strisciando verso il basso la pagina si abbassa (20/11: bloccarlo impediva di abbassarla)
      if (tg.setHeaderColor) tg.setHeaderColor('#1d2024');
      if (tg.setBackgroundColor) tg.setBackgroundColor('#1d2024');
      // In alto a sinistra niente «X»: con il tasto Indietro mostrato Telegram mette la freccia al posto della X.
      // La freccia non chiude: ricorda solo come abbassare la pagina. Si chiude solo con «Ferma».
      if (tg.onEvent) tg.onEvent('activated', () => { if (daChiudere) setTimeout(() => { try { tg.close(); } catch (e) {} }, 150); });  // riaperta dopo la sveglia: si chiude
      if (tg.BackButton) { tg.BackButton.show(); tg.BackButton.onClick(() => { vibra(false); evidenziaNota(); }); }
    }
  } catch (e) {}

  const adesso = Date.now();
  let fine;
  const memo = 'timer_' + (q.get('k') || '');
  let ricordata = 0;
  try { ricordata = parseInt(localStorage.getItem(memo), 10) || 0; } catch (e) {}
  if (q.get('avvio') && ricordata && ricordata > adesso - 60000) fine = ricordata;  // Telegram ha ricaricato la pagina: non si riparte da capo
  else if (q.get('avvio')) fine = adesso + sec * 1000;     // aperta da «Avvia recupero»: si parte adesso
  else fine = parseInt(q.get('fine'), 10) || 0;            // riaperta: l'ora di fine la dice il bot
  try { if (q.get('k') && fine) localStorage.setItem(memo, String(fine)); } catch (e) {}
  const ricaricata = !!(q.get('avvio') && ricordata && fine === ricordata);
  let spostati = 0;  // secondi aggiunti/tolti con ± 5 s dall'avvio (ricordati se Telegram ricarica la pagina)
  try { if (ricaricata) spostati = parseInt(localStorage.getItem(memo + '_d'), 10) || 0; } catch (e) {}
  sec = Math.max(1, sec + spostati);
  if (!q.get('sec') || !fine) {
    $('tempo').textContent = '--:--';
    $('sotto').textContent = 'Apri il timer dal tasto del bot';
    $('stato').hidden = true; $('nota').hidden = true; $('regola').hidden = true;
    return;
  }
  if (fine - adesso > sec * 1000 + 2000) fine = adesso + sec * 1000;  // orologio del telefono diverso da quello del PC
  const giaFinito = fine - adesso < -5000;

  // ---- postino (ntfy.sh): dal 21/11 pochissimi biglietti (limite gratuito di ntfy.sh per indirizzo: col wifi della
  // palestra tutti i telefoni escono con lo stesso). Solo: «avvio» (con «pronta» dentro), «pronta» (solo se il suono
  // arriva dopo), «muta» (suono spento dal telefono da più di 3 s), «chiusa», «ferma». Al massimo 2 tentativi. ----
  async function biglietto(e, extra) {
    if (!k || !topic) return false;
    // con il biglietto va anche un controllo: la pagina ha il suono? è visibile o abbassata?
    const corpo = JSON.stringify({ k, e, ...(extra || {}), v: VERSIONE, attiva: tg ? tg.isActive : null, tgv: tg ? tg.version : null, audio: mediaVa ? 'file' : audio ? audio.state : 'nessuno', vis: document.visibilityState });
    for (let i = 0; i < 2; i++) {
      try {
        const ctl = new AbortController(), stop = setTimeout(() => ctl.abort(), 10000);
        const r = await fetch(`${server}/${encodeURIComponent(topic)}`, { method: 'POST', body: corpo, keepalive: true, signal: ctl.signal });
        clearTimeout(stop);
        if (r.ok) return true;
      } catch (err) {}
      await new Promise(r => setTimeout(r, 400 * (i + 1)));
    }
    return false;
  }

  // Il bot ha fermato il recupero (⏹ ferma): biglietto «stop» con il nostro codice -> la pagina si ferma e si chiude.
  try {
    if (k && topic && window.EventSource) {
      const es = new EventSource(`${server}/${encodeURIComponent(topic)}/sse`);
      es.onerror = () => { try { es.close(); } catch (err) {} };  // rifiutato o caduto: niente tentativi a raffica
      es.onmessage = ev => {
        try { const m = JSON.parse(JSON.parse(ev.data).message || '{}'); if (m.k === k && m.e === 'stop') { es.close(); fermaTutto(); chiudi(); } } catch (err) {}
      };
    }
  } catch (e) {}

  const mmss = ms => { const s = Math.max(0, Math.ceil(ms / 1000)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; };
  const annuncia = t => { $('annuncio').textContent = ''; setTimeout(() => { $('annuncio').textContent = t; }, 50); };
  const suonaOk = () => mediaVa || !!(audio && audio.state === 'running');

  function vibra(forte) {
    try { if (tg && tg.HapticFeedback) { forte ? tg.HapticFeedback.notificationOccurred('warning') : tg.HapticFeedback.impactOccurred('light'); } } catch (e) {}
    try { if (navigator.vibrate) navigator.vibrate(forte ? [400, 150, 400, 150, 400] : 60); } catch (e) {}
  }

  function bip(freq, dur, vol, quando) {
    if (!audio) return null;
    const t0 = audio.currentTime + (quando || 0);
    const o = audio.createOscillator(), g = audio.createGain();
    o.type = 'square'; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.01);
    g.gain.setValueAtTime(vol, t0 + dur - 0.03);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g).connect(audio.destination);
    o.start(t0); o.stop(t0 + dur + 0.02);
    return o;
  }

  function nota(freq, vol, quando) {  // un colpo di campanello nel motore audio (riserva del file): suona e sfuma
    if (!audio) return [];
    const t0 = audio.currentTime + (quando || 0), out = [];
    [[1, 1], [2, 0.45], [3, 0.2]].forEach(([m, a]) => {
      const o = audio.createOscillator(), g = audio.createGain();
      o.type = 'sine'; o.frequency.value = freq * m;
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(vol * a, t0 + 0.005);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.6);
      o.connect(g).connect(audio.destination);
      o.start(t0); o.stop(t0 + 0.62);
      out.push(o);
    });
    return out;
  }

  function sveglia(tra) {  // stesso arpeggio a campanello del file: SQUILLI volte, uno al secondo, tra "tra" secondi
    const l = [];
    for (let i = 0; i < SQUILLI; i++) ARPEGGIO.forEach(([t0, f]) => l.push(...nota(f, 0.45, (tra || 0) + i + t0)));
    return l;
  }

  function evidenziaNota() {
    const n = $('nota');
    n.textContent = 'Per abbassarla: striscia verso il basso la barra in alto. Per chiuderla: «Ferma».';
    n.style.color = '#fff';
    setTimeout(() => { n.style.color = ''; }, 2500);
  }

  // La sveglia si programma nel motore audio all'ora di fine: se abbassi la pagina dentro Telegram e il telefono la tiene viva, suona lo stesso.
  function programma() {
    if (mediaVa || !(audio && audio.state === 'running') || programmati.length || suonato) return;
    const tra = (fine - Date.now()) / 1000;
    if (tra <= 0.3) return;
    oraSveglia = audio.currentTime + tra;
    programmati = sveglia(tra);
    chiudiAllaFineSuono(programmati);
    if (programmati.length) diciPronta();  // la sveglia è pronta nel motore audio: il bot non deve mandare messaggi
  }
  function togliProgrammati() { programmati.forEach(o => { try { o.stop(); } catch (e) {} }); programmati = []; }

  // ---- Sveglia come FILE AUDIO (dal 20/11 pomeriggio) ----
  // Un file WAV fatto qui: quasi silenzio per tutto il recupero e poi la sveglia. Il telefono lo suona come una canzone:
  // continua anche con la pagina abbassata, con altre app aperte o a schermo spento (il motore audio della pagina invece
  // il telefono lo addormentava). Il motore audio resta solo di riserva, se il file non parte.
  let media = null, mediaVa = false, mediaZero = 0, prontaMedia = false;
  // Sveglia: arpeggio a campanello do-mi-sol-do acuto, uno al secondo (squillante, note che sfumano). Dal 25/11 3 squilli (prima 4).
  const SQUILLI = 3;
  const ARPEGGIO = [[0, 1046.5], [0.12, 1318.5], [0.24, 1568], [0.36, 2093]];
  function campanello(d, f) {  // un colpo di campanello: armoniche brillanti che sfumano
    if (d < 0 || d > 0.6) return 0;
    const att = Math.min(1, d / 0.004), dec = Math.exp(-d * 6.5), w = 2 * Math.PI * f * d;
    return att * dec * (Math.sin(w) + 0.45 * Math.sin(2 * w) + 0.2 * Math.sin(3 * w) + 0.12 * Math.sin(4.2 * w) * Math.exp(-d * 12));
  }
  function creaSuono(silenzio) {
    const R = 16000, n = Math.ceil((silenzio + SQUILLI + 0.3) * R), buf = new ArrayBuffer(44 + n * 2), v = new DataView(buf);
    const s = (o, t) => { for (let i = 0; i < t.length; i++) v.setUint8(o + i, t.charCodeAt(i)); };
    s(0, 'RIFF'); v.setUint32(4, 36 + n * 2, true); s(8, 'WAVE'); s(12, 'fmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true);
    v.setUint16(22, 1, true); v.setUint32(24, R, true); v.setUint32(28, R * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
    s(36, 'data'); v.setUint32(40, n * 2, true);
    const i0 = Math.floor(silenzio * R);
    for (let i = 0; i < i0; i++) v.setInt16(44 + i * 2, Math.round(40 * Math.sin(2 * Math.PI * 30 * i / R)), true);  // non si sente
    const note = [];
    for (let g = 0; g < SQUILLI; g++) ARPEGGIO.forEach(([t0, f]) => note.push([g + t0, f]));
    for (let i = i0; i < n; i++) {
      const t = (i - i0) / R;
      let x = 0;
      for (const [t0, f] of note) if (t >= t0 && t - t0 < 0.6) x += campanello(t - t0, f);
      v.setInt16(44 + i * 2, Math.round(Math.tanh(x * 0.75) * 31000), true);  // forte ma senza gracchiare
    }
    return URL.createObjectURL(new Blob([buf], { type: 'audio/wav' }));
  }
  function riallinea() {  // dopo una pausa il file si rimette al punto giusto: la sveglia cade sempre all'ora di fine
    if (!media) return;
    const p = (Date.now() - mediaZero) / 1000;
    if (Math.abs(media.currentTime - p) > 0.4) { try { media.currentTime = Math.max(0, p); } catch (e) {} }
  }
  function avviaMedia() {
    if (media) { if (media.paused && !fermato && !suonato) media.play().catch(() => {}); return; }
    if (fermato || suonato || sec > 600) return;  // oltre 10 minuti il file sarebbe troppo grande: suona il motore audio
    const tra = (fine - Date.now()) / 1000;
    if (tra <= 0.5) return;
    try {
      const m = media = new Audio(creaSuono(tra));  // m: ogni ascoltatore vale solo per il suo file (± 5 s lo rifà)
      mediaZero = fine - tra * 1000;
      media.addEventListener('playing', () => {
        if (m !== media) return;
        mediaVa = true; riallinea(); togliProgrammati(); aggiornaStato();
        prontaMedia = true; annullaMuta(); diciPronta();
      });
      media.addEventListener('ended', () => {  // sveglia finita (vale anche se la pagina è abbassata e i timer sono fermi)
        if (m !== media) return;
        if (!fermato) { fermaTutto(); chiudi(); }
      });
      media.addEventListener('pause', () => {
        if (m !== media || fermato || media.ended) return;
        mediaVa = false; aggiornaStato();
        forseMuta();  // fermato dal telefono: se dura più di 3 s il bot lo sa (riserva)
        media.play().catch(() => {});
        programma();
      });
      try { if ('mediaSession' in navigator) navigator.mediaSession.metadata = new MediaMetadata({ title: 'Recupero', artist: 'Sveglia a fine tempo' }); } catch (e) {}
      media.play().catch(() => {});
    } catch (e) { media = null; }
  }

  // ---- − 5 s / + 5 s (dal 24/11/2026): l'ora di fine si sposta subito, senza conferme. La sveglia si sposta con lei
  // (il file si riallinea o si rifà, il motore audio si riprogramma). Il bot lo sa con UN biglietto «tempo», 1,5 s dopo
  // l'ultimo tocco (pochi biglietti per ntfy.sh), con il totale spostato dall'avvio: così il suo recupero finisce insieme.
  let attesaTempo = null;
  function sposta(d) {
    if (fermato || suonato) return;
    const ora = Date.now();
    const nuova = Math.min(ora + 3600 * 1000, Math.max(ora + 1000, fine + d * 1000));  // mai sotto 1 s, mai oltre 1 ora
    const fatto = Math.round((nuova - fine) / 1000);
    if (!fatto) { vibra(false); return; }
    fine = nuova; sec = Math.max(1, sec + fatto); spostati += fatto;
    try { if (k) { localStorage.setItem(memo, String(fine)); localStorage.setItem(memo + '_d', String(spostati)); } } catch (e) {}
    if (media) {
      mediaZero += fatto * 1000;
      if (Date.now() - mediaZero < 0) {  // il file è più corto del nuovo tempo: se ne fa un altro (il tocco permette di suonarlo)
        const vecchio = media; media = null; mediaVa = false;
        try { vecchio.pause(); vecchio.removeAttribute('src'); vecchio.load(); } catch (e) {}
        avviaMedia();
      } else riallinea();
    }
    if (programmati.length) { togliProgrammati(); programma(); }
    vibra(false);
    annuncia(`Recupero ${mmss(fine - Date.now())}`);
    giroSubito();
    if (q.get('avvio') || k) {
      if (attesaTempo) clearTimeout(attesaTempo);
      attesaTempo = setTimeout(() => { attesaTempo = null; if (!fermato) biglietto('tempo', { d: spostati }); }, 1500);
    }
  }
  $('meno').onclick = () => sposta(-5);
  $('piu').onclick = () => sposta(5);

  function aggiornaStato() {
    const ok = suonaOk();
    $('stato').classList.toggle('on', ok);
    $('statoTesto').textContent = ok ? 'Sveglia pronta' : 'Tocca lo schermo per il suono';
  }

  // Il suono parte da solo se il telefono lo permette; se no basta un tocco qualsiasi sulla pagina (nessun riquadro da toccare).
  // Il telefono addormenta l'audio di una pagina che resta muta (registro del 20/11: a fine tempo «suono suspended»
  // anche a pagina aperta, e la sveglia non suonava). Un tono bassissimo e debolissimo, che non si sente, lo tiene sveglio.
  let tenuta = null, mutaDetta = false, avvioDetto = false, prontaDetta = false, attesaMuta = null;
  // «pronta» si manda solo dopo l'avvio (all'avvio va dentro il biglietto «avvio») e una volta sola, o di nuovo dopo «muta»
  function diciPronta() {
    if (!avvioDetto || (prontaDetta && !mutaDetta) || fermato || suonato) return;
    prontaDetta = true; mutaDetta = false; biglietto('pronta');
  }
  // «muta» solo se il suono resta spento più di 3 secondi (all'apertura il telefono lo spegne e riaccende in un attimo)
  function forseMuta() {
    if (mutaDetta || attesaMuta || fermato || suonato) return;
    attesaMuta = setTimeout(() => { attesaMuta = null; if (!suonaOk() && !fermato && !suonato && avvioDetto) { mutaDetta = true; biglietto('muta'); } }, 3000);
  }
  function annullaMuta() { if (attesaMuta) { clearTimeout(attesaMuta); attesaMuta = null; } }
  function tieniSveglioAudio() {
    if (!audio || tenuta || audio.state !== 'running') return;
    try {
      const o = audio.createOscillator(), g = audio.createGain();
      o.frequency.value = 25; g.gain.value = 0.003;
      o.connect(g).connect(audio.destination); o.start();
      tenuta = o;
    } catch (e) {}
  }
  async function sblocca() {
    avviaMedia();
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC && !audio) {
        audio = new AC();
        audio.onstatechange = () => {
          aggiornaStato();
          if (fermato || suonato || mediaVa) return;  // suona il file: il motore audio non conta
          if (audio.state === 'running') {  // tornato acceso: sveglia di nuovo pronta
            // da spento l'orologio dell'audio si ferma: la sveglia programmata prima suonerebbe in ritardo, si rifà
            annullaMuta(); if (mutaDetta) { togliProgrammati(); tieniSveglioAudio(); programma(); }  // programma() manda «pronta»
            return;
          }
          audio.resume().catch(() => {});  // prova a riaccenderlo; intanto il bot sa che la sveglia può non suonare
          forseMuta();
        };
      }
      if (audio && audio.state === 'suspended') await audio.resume();
    } catch (e) {}
    tieniSveglioAudio();
    aggiornaStato();
    programma();
  }
  async function tieniAcceso() {
    try { if ('wakeLock' in navigator && !wake) { wake = await navigator.wakeLock.request('screen'); wake.addEventListener('release', () => { wake = null; }); } } catch (e) {}
  }
  ['pointerdown', 'touchstart', 'keydown'].forEach(ev => document.addEventListener(ev, () => { sblocca(); tieniAcceso(); }, { passive: true }));

  // Mai chiudere la pagina mentre è abbassata (chiudeva anche la chat/Telegram): si chiude quando torna visibile.
  let daChiudere = false;
  // Dal 20/11 sera si chiude ANCHE abbassata (il titolare vuole che la barretta sotto la chat sparisca da sola a fine
  // recupero); se Telegram non la chiude mentre è abbassata, ci si riprova appena torna visibile.
  let chiusuraDetta = false;
  // Alla chiusura la tastiera del telefono non deve aprirsi (24/11): niente resta selezionato nella pagina e, dove
  // Telegram lo permette (Bot API 9.1), si chiede di nascondere la tastiera prima di chiudere.
  function niente_tastiera() {
    try { if (document.activeElement && document.activeElement.blur) document.activeElement.blur(); } catch (e) {}
    try { if (tg && tg.hideKeyboard) tg.hideKeyboard(); } catch (e) {}
  }
  function chiudi() {
    niente_tastiera();
    const abbassata = document.visibilityState !== 'visible' || (tg && tg.isActive === false);
    if (abbassata) daChiudere = true;
    if (abbassata) {
      // Telegram ignora la chiusura di una pagina abbassata: prima si prova a farla tornare su (expand), poi si chiude.
      try { if (tg && tg.expand) tg.expand(); } catch (e) {}
      setTimeout(() => { try { if (tg && tg.close) tg.close(); } catch (e) {} }, 350);
    }
    try { if (tg && tg.close) tg.close(); } catch (e) {}
  }
  function chiudiAllaFineSuono(nodi) {  // la fine dell'ultimo suono sveglia la pagina anche abbassata: lì si chiude
    const ultimo = nodi && nodi[nodi.length - 1];
    if (ultimo) ultimo.onended = () => { if (!fermato && Date.now() >= fine) { fermaTutto(); chiudi(); } };
  }

  // «Ferma»: prima della fine ferma anche il recupero del bot (biglietto «ferma»), poi la pagina si chiude.
  async function ferma() {
    const prima = !suonato && Date.now() < fine;
    fermaTutto();
    if (prima) await biglietto('ferma');
    chiudi();
  }

  function fermaTutto() {
    fermato = true;
    togliProgrammati();
    if (tenuta) { try { tenuta.stop(); } catch (e) {} tenuta = null; }
    if (media) { try { media.pause(); } catch (e) {} }
    if (lampo) { clearInterval(lampo); lampo = null; }
    document.body.classList.remove('lampo');
    try { if (audio) audio.suspend(); } catch (e) {}
    try { if (navigator.vibrate) navigator.vibrate(0); } catch (e) {}
    $('fermo').hidden = true; $('regola').hidden = true;
    $('sotto').textContent = 'Sveglia fermata';
  }

  function finito() {
    document.body.classList.add('fine');
    $('regola').hidden = true;
    $('tempo').textContent = 'Prossima serie!';
    $('sotto').textContent = '';
    $('pieno').style.strokeDashoffset = GIRO;
    if (suonato || giaFinito || Date.now() - fine >= 5000) {  // risvegliata molto dopo la fine: niente sveglia in ritardo, si chiude
      if (!giaFinito && !fermato) {
        suonato = true; fermaTutto(); chiudi();
      }
      return;
    }
    suonato = true;
    annuncia('Recupero finito: prossima serie');
    const sento = suonaOk();
    if (mediaVa) riallinea();  // il file suona da solo la sveglia (che è già nel file all'ora di fine)
    else if (sento && !programmati.length) { programmati = sveglia(0); chiudiAllaFineSuono(programmati); }  // se era già programmata sta suonando da sola
    if (!sento && audio) audio.resume().then(() => { if (!fermato && audio.state === 'running') { togliProgrammati(); programmati = sveglia(0); } }).catch(() => {});
    // Dopo la sveglia (3 s) la pagina si chiude da sola. Abbassata, Telegram la tiene ferma e la risveglia solo per un
    // attimo (registro 20/11: «suonato» arrivato 6 s dopo la fine): se la sveglia è già passata si chiude SUBITO.
    const chiudiTra = fine + 4500 - Date.now();
    if (chiudiTra <= 0) { fermaTutto(); chiudi(); }
    else setTimeout(() => { if (!fermato) { fermaTutto(); chiudi(); } }, chiudiTra);
    let n = 0;
    lampo = setInterval(() => {
      if (fermato || n++ > 15) { clearInterval(lampo); lampo = null; document.body.classList.remove('lampo'); return; }
      document.body.classList.toggle('lampo');
      if (n % 2) vibra(true);
    }, 500);
  }

  function disegna(resto) {
    $('tempo').textContent = mmss(resto);
    $('pieno').style.strokeDashoffset = GIRO * (1 - Math.min(1, resto / (sec * 1000)));
    $('sotto').textContent = resto <= 10000 ? 'Preparati' : `di ${mmss(sec * 1000)}`;
    $('meno').disabled = resto <= 1500;
  }
  function giroSubito() { const resto = fine - Date.now(); if (resto > 0 && !fermato) disegna(resto); }  // dopo ± 5 s
  function giro() {
    if (fermato) return;
    const resto = fine - Date.now();
    if (resto <= 0) { finito(); return; }
    disegna(resto);
    setTimeout(giro, Math.min(250, resto));
  }

  $('fermo').onclick = ferma;
  // Pagina chiusa (X della barretta, menu di Telegram) prima della sveglia: il bot squilla lui.
  window.addEventListener('pagehide', () => {
    if (fermato || suonato || !k || !topic) return;
    try {
      const corpo = JSON.stringify({ k, e: 'chiusa', audio: audio ? audio.state : 'nessuno', vis: document.visibilityState });
      if (!(navigator.sendBeacon && navigator.sendBeacon(`${server}/${encodeURIComponent(topic)}`, corpo)))
        fetch(`${server}/${encodeURIComponent(topic)}`, { method: 'POST', body: corpo, keepalive: true });
    } catch (e) {}
  });
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState !== 'visible') return;
    if (daChiudere) { setTimeout(chiudi, 400); return; }
    tieniAcceso();
    if (programmati.length && audio && audio.currentTime < oraSveglia && Date.now() > fine + 5000) togliProgrammati();
    if (audio && audio.state === 'suspended' && !fermato) audio.resume().then(aggiornaStato).catch(() => {});
    if (media && media.paused && !fermato && !suonato) media.play().catch(() => {});
  });

  // «avvio» dopo aver provato ad accendere il suono (al massimo 0,8 s: senza permesso il telefono può non rispondere mai)
  Promise.race([sblocca(), new Promise(r => setTimeout(r, 800))]).then(() => { if (q.get('avvio') && !giaFinito && !ricaricata) { const pr = suonaOk(); avvioDetto = true; prontaDetta = pr; biglietto('avvio', { pronta: pr }); } else avvioDetto = true; });
  tieniAcceso();
  setTimeout(aggiornaStato, 600);
  if (giaFinito) { finito(); $('sotto').textContent = 'Il recupero era già finito'; }
  else giro();
})();
</script>
</body>
</html>
